[tox]
envlist = py314, cli, lint, check-format, typecheck, cli-typecheck

# Backend envs build the root package; CLI envs install ./cli instead and run from
# there, because the two packages have different Python floors (3.14 vs 3.10) and
# separate dependency sets.

[testenv]
description = Run backend tests
deps =
    pytest
    pytest-django
commands = pytest {posargs:tests/}

[testenv:test-cov]
description = Run backend tests with coverage
deps =
    pytest
    pytest-django
    pytest-cov
commands = pytest --cov=sessionbin --cov-report=term-missing {posargs}

[testenv:cli]
description = Run CLI tests
basepython = python3.13
skip_install = true
changedir = cli
deps =
    pytest
    -e ./cli
commands = pytest {posargs:tests/}

[testenv:lint]
description = Run code linter over both packages
skip_install = true
deps = ruff
commands = ruff check .

[testenv:lint-fix]
description = Fix linting errors
skip_install = true
deps = ruff
commands = ruff check --fix .

[testenv:check-format]
description = Check code formatting over both packages
skip_install = true
deps = ruff
commands = ruff format --check --diff .

[testenv:format]
description = Format code
skip_install = true
deps = ruff
commands = ruff format .

[testenv:typecheck]
description = Run type checker over the backend
basepython = python3.14
deps =
    mypy
    django-stubs
    types-Pygments
commands = mypy src/

[testenv:cli-typecheck]
description = Run type checker over the CLI
basepython = python3.13
skip_install = true
changedir = cli
deps =
    mypy
    types-click
    -e ./cli
commands = mypy src/sessionbin_cli
