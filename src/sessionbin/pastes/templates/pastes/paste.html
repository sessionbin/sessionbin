{% extends "pastes/base.html" %}
{% load static %}
{% block title %}{{ paste.slug }} — sessionbin{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/transcript.css' %}">
<script src="{% static 'js/transcript.js' %}" defer></script>
{% endblock %}
{% block meta %}
<meta property="og:title" content="{{ paste.slug }} — sessionbin">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:site_name" content="sessionbin">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ paste.slug }} — sessionbin">
<meta name="twitter:description" content="{{ og_description }}">
{% endblock %}
{% block nav_actions %}
<a href="{% url 'raw-paste' paste.slug %}" class="nav-icon" title="Download raw JSONL" aria-label="Download raw JSONL"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/></svg></a>
{% endblock %}
{% block content %}
{{ fragment|safe }}
{% endblock %}
