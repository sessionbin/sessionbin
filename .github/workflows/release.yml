name: Publish container image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # The same gate as CI. A tag must not ship an image that main would have rejected.
  tox:
    name: Check
    if: ${{ github.repository_owner == 'sessionbin' }}
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:44
    steps:
      - name: Install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3.13 python-unversioned-command gitleaks tox git
          dnf clean all

      - uses: actions/checkout@v5

      - run: tox run

  # On the bare runner, where podman is preinstalled: a container job cannot set up the
  # user namespaces a build needs and fails with "cannot clone: Operation not permitted".
  publish:
    name: Build and push to GHCR
    needs: tox
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # The runner image ships a crun build incompatible with podman 5.8.x. runc comes
      # with containerd and sidesteps it. Drop this once the runner image is fixed.
      - name: Configure podman to use runc
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/containers
          printf '[engine]\nruntime = "runc"\n' | sudo tee /etc/containers/containers.conf
          podman info --format 'Runtime: {{.Host.OCIRuntime.Name}}'

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build
        run: podman build -t "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" -f deploy/Containerfile .

      - name: Push
        run: podman push "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
