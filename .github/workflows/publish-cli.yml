name: Publish CLI to PyPI

# Prefixed so backend image tags (v0.1.0) and CLI release tags stay unambiguous in one repo.
on:
  push:
    tags:
      - 'cli-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # The same gate as CI. A tag must not publish a package that main would have rejected.
  tox:
    name: Check
    if: ${{ github.repository_owner == 'sessionbin' }}
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:44
    steps:
      - name: Install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            python3 python3.13 python-unversioned-command gitleaks tox git
          dnf clean all

      - uses: actions/checkout@v5

      - run: tox run

  build-and-publish:
    name: Build and publish to PyPI
    needs: tox
    if: ${{ github.repository_owner == 'sessionbin' }}

    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # The CLI is its own uv project under cli/; the repo root is the backend.
      - name: Build sdist and wheel
        run: uv build --project cli --out-dir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
