[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "sessionbin"
version = "0.2.0"
description = "CLI for uploading and managing sessionbin transcripts"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Martin Prpič", email = "martin.prpic@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "platformdirs>=4.3",
    "questionary>=2.1",
]

[project.urls]
Homepage = "https://github.com/sessionbin/sessionbin"
Repository = "https://github.com/sessionbin/sessionbin"

[project.scripts]
sessionbin = "sessionbin_cli.cli:cli"

# The distribution is published as `sessionbin`, but the import package is
# `sessionbin_cli` so it cannot collide with the backend's `sessionbin` package.
[tool.uv.build-backend]
module-name = "sessionbin_cli"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = ["F", "E", "W", "I", "N"]

# Present so pytest stops here and does not inherit the backend's Django settings
# from the repo-root pyproject.toml.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true
warn_unused_ignores = true
